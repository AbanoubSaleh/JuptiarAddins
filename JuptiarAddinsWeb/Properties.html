<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Document Properties</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <!-- Office UI Fabric -->
    <link rel="stylesheet" href="Content/fabric.min.css" />
    <link rel="stylesheet" href="Content/OfficeThemes.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="Properties.css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <div class="ms-Grid properties-container">
        <!-- Header -->
        <div class="ms-Grid-row header-section">
            <div class="ms-Grid-col ms-sm12">
                <h2 class="ms-font-xl ms-fontColor-themePrimary">Document Properties</h2>
                <p class="ms-font-s">Edit metadata and properties for the current document.</p>
            </div>
        </div>

        <!-- Authentication Check -->
        <div class="ms-Grid-row auth-section" id="authSection">
            <div class="ms-Grid-col ms-sm12">
                <div class="auth-status" id="authStatus">
                    <div class="status-indicator offline" id="authIndicator"></div>
                    <span id="authStatusText">Not authenticated</span>
                    <button id="loginBtn" class="ms-Button ms-Button--primary">
                        <span class="ms-Button-label">Login</span>
                    </button>
                </div>
            </div>
        </div>


        <!-- Metadata (simple) -->
        <div class="ms-Grid-row" id="metaSection" style="display: none;">
            <div class="ms-Grid-col ms-sm12">
                <div class="form-section">
                    <h3 class="ms-font-l">Document Metadata</h3>

                    <div class="ms-TextField">
                        <label class="ms-Label">Title</label>
                        <input type="text" id="docTitle" class="ms-TextField-field" placeholder="Document title" />
                    </div>

                    <div class="ms-TextField">
                        <label class="ms-Label">Description</label>
                        <textarea id="docDescription" class="ms-TextField-field textarea" placeholder="Document description" rows="3"></textarea>
                    </div>

                    <div class="ms-TextField">
                        <label class="ms-Label">Tags</label>
                        <input type="text" id="docTags" class="ms-TextField-field" placeholder="Enter tags separated by commas" />
                        <span class="ms-TextField-description">Separate multiple tags with commas</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="ms-Grid-row action-section" id="actionSection" style="display: none;">
            <div class="ms-Grid-col ms-sm12">
                <div class="action-buttons">
                    <button id="savePropertiesBtn" class="ms-Button ms-Button--primary">
                        <span class="ms-Button-label">Save Properties</span>
                    </button>
                    <button id="resetPropertiesBtn" class="ms-Button">
                        <span class="ms-Button-label">Reset</span>
                    </button>
                    <button id="cancelPropertiesBtn" class="ms-Button">
                        <span class="ms-Button-label">Cancel</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div class="ms-Grid-row message-section" id="messageSection" style="display: none;">
            <div class="ms-Grid-col ms-sm12">
                <div class="ms-MessageBar" id="messageBar">
                    <div class="ms-MessageBar-content">
                        <div class="ms-MessageBar-icon" id="messageIcon">
                            <i class="ms-Icon"></i>
                        </div>
                        <div class="ms-MessageBar-text" id="messageText">
                            Properties saved successfully.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="ms-Grid-row loading-section" id="loadingSection">
            <div class="ms-Grid-col ms-sm12 text-center">
                <div class="ms-Spinner ms-Spinner--large">
                    <div class="ms-Spinner-circle"></div>
                </div>
                <p class="ms-font-m">Loading document properties...</p>
            </div>
        </div>
    </div>


    <!-- Custom JavaScript -->
    <script type="text/javascript" src="Scripts/config.js"></script>
    <script type="text/javascript" src="Scripts/JupiterService.js"></script>
    <script type="text/javascript" src="Scripts/AuthManager.js"></script>
    <script type="text/javascript" src="Scripts/DocumentStateManager.js"></script>
    <script type="text/javascript" src="Scripts/PropertiesEditor.js?v=4"></script>
    <script type="text/javascript" src="Scripts/Properties.js?v=4"></script>

</body>
</html>
