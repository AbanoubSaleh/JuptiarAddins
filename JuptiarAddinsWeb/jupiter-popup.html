<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jupiter DMS</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .dialog-container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
        }

        .dialog-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .dialog-icon {
            font-size: 24px;
            margin-right: 12px;
            color: #0078d4;
        }

        .dialog-title {
            font-size: 18px;
            font-weight: 600;
            color: #323130;
            margin: 0;
        }

        .dialog-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .dialog-message {
            font-size: 14px;
            color: #605e5c;
            line-height: 1.5;
            margin-bottom: 24px;
            text-align: center;
        }

        .dialog-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
        }

        .dialog-button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            min-width: 80px;
            transition: background-color 0.2s ease;
        }

        .dialog-button:hover {
            background-color: #106ebe;
        }

        .dialog-button.secondary {
            background-color: #f3f2f1;
            color: #323130;
            border: 1px solid #d2d0ce;
        }

        .dialog-button.secondary:hover {
            background-color: #edebe9;
        }

        .dialog-button:focus {
            outline: 2px solid #0078d4;
            outline-offset: 2px;
        }

        .dialog-button:disabled {
            background-color: #f3f2f1;
            color: #a19f9d;
            cursor: not-allowed;
        }

        /* Icon styles for different message types */
        .icon-info::before { content: "ℹ️"; }
        .icon-warning::before { content: "⚠️"; }
        .icon-error::before { content: "❌"; }
        .icon-success::before { content: "✅"; }
        .icon-checkout::before { content: "🔒"; }

        /* Loading state */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0078d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="dialog-container">
        <div class="dialog-header">
            <div class="dialog-icon icon-info" id="dialogIcon"></div>
            <h2 class="dialog-title">Jupiter DMS</h2>
        </div>

        <div class="dialog-content">
            <div class="dialog-message" id="dialogMessage">
                Loading...
            </div>

            <div class="dialog-buttons" id="dialogButtons">
                <!-- Buttons will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        let currentAction = null;
        let isProcessing = false;

        // Initialize Office.js
        if (typeof Office !== 'undefined' && Office.onReady) {
            Office.onReady(() => {
                console.log('Jupiter popup dialog ready');
                initializeDialog();
            });
        } else {
            console.warn('jupiter-popup.html: Office.js not available');
            // Initialize anyway for testing
            document.addEventListener('DOMContentLoaded', initializeDialog);
        }

        function initializeDialog() {
            try {
                // Parse URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const message = urlParams.get('message') || 'No message provided';
                const optionsParam = urlParams.get('options');
                
                let options = [];
                if (optionsParam) {
                    try {
                        options = JSON.parse(decodeURIComponent(optionsParam));
                    } catch (error) {
                        console.error('Error parsing options:', error);
                        options = [{ text: 'OK', action: 'ok' }];
                    }
                } else {
                    options = [{ text: 'OK', action: 'ok' }];
                }

                // Set message
                document.getElementById('dialogMessage').textContent = message;

                // Set appropriate icon based on message content
                setDialogIcon(message);

                // Create buttons
                createButtons(options);

                console.log('Dialog initialized with message:', message);

            } catch (error) {
                console.error('Error initializing dialog:', error);
                document.getElementById('dialogMessage').textContent = 'Error loading dialog';
                createButtons([{ text: 'OK', action: 'ok' }]);
            }
        }

        function setDialogIcon(message) {
            const iconElement = document.getElementById('dialogIcon');
            const lowerMessage = message.toLowerCase();

            if (lowerMessage.includes('check out') || lowerMessage.includes('checkout')) {
                iconElement.className = 'dialog-icon icon-checkout';
            } else if (lowerMessage.includes('error') || lowerMessage.includes('failed')) {
                iconElement.className = 'dialog-icon icon-error';
            } else if (lowerMessage.includes('success')) {
                iconElement.className = 'dialog-icon icon-success';
            } else if (lowerMessage.includes('warning') || lowerMessage.includes('locked')) {
                iconElement.className = 'dialog-icon icon-warning';
            } else {
                iconElement.className = 'dialog-icon icon-info';
            }
        }

        function createButtons(options) {
            const buttonsContainer = document.getElementById('dialogButtons');
            buttonsContainer.innerHTML = '';

            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = index === 0 ? 'dialog-button' : 'dialog-button secondary';
                button.textContent = option.text;
                button.onclick = () => handleButtonClick(option.action);
                
                // Set focus on first button
                if (index === 0) {
                    setTimeout(() => button.focus(), 100);
                }

                buttonsContainer.appendChild(button);
            });
        }

        function handleButtonClick(action) {
            if (isProcessing) return;

            currentAction = action;
            console.log('Button clicked:', action);

            if (action === 'checkout') {
                // Show loading state for checkout
                setLoadingState(true);
                // Send message after a brief delay to show loading state
                setTimeout(() => sendMessage(action), 500);
            } else {
                sendMessage(action);
            }
        }

        function setLoadingState(loading) {
            isProcessing = loading;
            const container = document.querySelector('.dialog-container');
            const buttons = document.querySelectorAll('.dialog-button');

            if (loading) {
                container.classList.add('loading');
                buttons.forEach(btn => {
                    if (btn.textContent.includes('Check Out')) {
                        btn.innerHTML = '<span class="spinner"></span>Checking out...';
                    }
                    btn.disabled = true;
                });
            } else {
                container.classList.remove('loading');
                buttons.forEach(btn => {
                    btn.disabled = false;
                    if (btn.innerHTML.includes('spinner')) {
                        btn.textContent = 'Check Out';
                    }
                });
            }
        }

        function sendMessage(action) {
            try {
                if (typeof Office !== 'undefined' && Office.context && Office.context.ui) {
                    Office.context.ui.messageParent(action);
                } else {
                    // Fallback for testing
                    console.log('Would send message:', action);
                    window.close();
                }
            } catch (error) {
                console.error('Error sending message:', error);
                window.close();
            }
        }

        // Handle keyboard events
        document.addEventListener('keydown', function(event) {
            if (isProcessing) return;

            if (event.key === 'Enter') {
                const firstButton = document.querySelector('.dialog-button');
                if (firstButton) {
                    firstButton.click();
                }
            } else if (event.key === 'Escape') {
                sendMessage('cancel');
            }
        });
    </script>
</body>
</html>
