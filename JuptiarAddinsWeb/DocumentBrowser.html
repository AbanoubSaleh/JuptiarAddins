<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jupiter Document Browser</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <!-- Office UI Fabric -->
    <link rel="stylesheet" href="Content/fabric.min.css" />
    <link rel="stylesheet" href="Content/OfficeThemes.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="DocumentBrowser.css?v=3" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <!-- Modal Dialog Overlay -->
    <div id="dialogOverlay" class="dialog-overlay">
        <!-- Open Document Dialog -->
        <div id="openDocumentDialog" class="open-document-dialog">
            <!-- Dialog Header -->
            <div class="dialog-header">
                <h3 class="dialog-title">
                    <span class="ms-Icon ms-Icon--FolderOpen" style="margin-right: 8px; color: #0078d4;"></span>
                    Open Document
                </h3>
                <div class="header-controls">
                    <div class="auth-status-mini" id="authStatusMini">
                        <span id="authStatusText">Not authenticated</span>
                        <button id="loginBtn" class="ms-Button ms-Button--small">
                            <span class="ms-Button-label">Login</span>
                        </button>
                        <button id="logoutBtn" class="ms-Button ms-Button--small" style="display: none;">
                            <span class="ms-Button-label">Logout</span>
                        </button>
                    </div>
                    <button id="closeDialogBtn" class="close-dialog-btn" title="Close">
                        <span class="ms-Icon ms-Icon--Cancel"></span>
                    </button>
                </div>
            </div>

            <!-- Search Controls -->
            <div class="search-controls">
                <div class="search-left">
                    <button id="refreshBtn" class="refresh-btn" title="Refresh">
                        <span class="ms-Icon ms-Icon--Refresh"></span>
                        Refresh
                    </button>
                </div>
                <div class="search-right">
                    <input type="text" id="fileSearchInput" placeholder="File search" class="file-search-input" />

                </div>
            </div>

            <!-- Main Content Area -->
            <div class="dialog-content" id="mainContent">
                <!-- Two-Panel Layout -->
                <div class="content-panels">
                    <!-- Left Panel - Folder Tree -->
                    <div class="left-panel">
                        <div class="panel-header">
                            <span class="ms-Icon ms-Icon--FolderOpen"></span>
                            Libraries
                        </div>
                        <div id="folderTree" class="folder-tree">
                            <!-- Folder tree will be populated here -->
                        </div>
                    </div>

                    <!-- Right Panel - Document List -->
                    <div class="right-panel">
                        <div class="panel-header">
                            <span class="ms-Icon ms-Icon--Document"></span>
                            Documents
                        </div>
                        <div class="document-list-container">
                            <table id="documentList" class="document-table">
                                <thead>
                                    <tr>
                                        <th class="col-type">Type</th>
                                        <th class="col-name">File Name</th>
                                        <th class="col-date">Date Modified</th>
                                        <th class="col-size">Size</th>
                                    </tr>
                                </thead>
                                <tbody id="documentTableBody">
                                    <!-- Documents will be populated here -->
                                </tbody>
                            </table>
                        </div>
                            <div id="paginationControls" class="pagination-controls" style="display:none; align-items:center; justify-content:flex-end; gap:8px; padding:8px 0;">
                                <button id="prevPageBtn" class="ms-Button"><span class="ms-Button-label">Prev</span></button>
                                <span id="pageInfo" class="ms-font-s">Page 1 of 1</span>
                                <button id="nextPageBtn" class="ms-Button"><span class="ms-Button-label">Next</span></button>
                            </div>

                    </div>
                </div>
            </div>

            <!-- Dialog Footer -->
            <div class="dialog-footer">
                <button id="openBtn" class="ms-Button ms-Button--primary" disabled>
                    <span class="ms-Button-label">Open</span>
                </button>
                <button id="cancelBtn" class="ms-Button">
                    <span class="ms-Button-label">Cancel</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading-overlay" id="loadingSection" style="display: none;">
        <div class="loading-content">
            <div class="ms-Spinner ms-Spinner--large">
                <div class="ms-Spinner-circle"></div>
            </div>
            <p class="ms-font-m" id="loadingMessage">Loading...</p>
        </div>
    </div>

    <!-- Error Message -->
    <div class="error-overlay" id="errorSection" style="display: none;">
        <div class="error-content">
            <div class="ms-MessageBar ms-MessageBar--error">
                <div class="ms-MessageBar-content">
                    <div class="ms-MessageBar-icon">
                        <i class="ms-Icon ms-Icon--ErrorBadge"></i>
                    </div>
                    <div class="ms-MessageBar-text" id="errorMessage">
                        An error occurred while loading documents.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Login to Juptiar</h3>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="ms-TextField">
                    <label class="ms-Label">Username:</label>
                    <input type="text" id="username" class="ms-TextField-field" />
                </div>
                <div class="ms-TextField">
                    <label class="ms-Label">Password:</label>
                    <input type="password" id="password" class="ms-TextField-field" />
                </div>
                <!-- Server URL is now pre-configured, no need for user input -->
            </div>
            <div class="modal-footer">
                <button id="loginSubmitBtn" class="ms-Button ms-Button--primary">
                    <span class="ms-Button-label">Login</span>
                </button>
                <button id="loginCancelBtn" class="ms-Button">
                    <span class="ms-Button-label">Cancel</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <ul>
            <li id="openDocument">Open</li>
            <li id="viewHistory">View History</li>
            <li id="deleteDocument">Delete</li>
            <li id="editProperties">Properties</li>
        </ul>
    </div>

    <!-- Version History Modal -->
    <div id="versionHistoryModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Version History</h3>
                <span class="close" id="closeVersionModal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="versionHistoryList" class="version-list"></div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script type="text/javascript" src="Scripts/config.js?v=2"></script>
    <script type="text/javascript" src="Scripts/JupiterService.js?v=5"></script>
    <script type="text/javascript" src="Scripts/AuthManager.js?v=2"></script>
    <script type="text/javascript" src="Scripts/DocumentStateManager.js?v=1"></script>
    <script type="text/javascript" src="Scripts/DocumentTracker.js?v=1"></script>
    <script type="text/javascript" src="Scripts/DocumentBrowser.js?v=7"></script>

</body>
</html>
